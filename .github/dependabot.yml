version: 2
updates:
  # Dependencias pnpm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Caracas"
    open-pull-requests-limit: 5
    # Solo seguridad + prod deps (evitar noise de devDeps menores)
    groups:
      prod-minor:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      dev-patch:
        dependency-type: "development"
        update-types: ["patch"]
    ignore:
      # eslint-plugin-react no es compatible con ESLint 10 todavía
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    # La acción compuesta local (.github/actions/setup) usa pnpm/action-setup y
    # actions/setup-node: con `directory: "/"` Dependabot solo mira .github/workflows.
    directories:
      - "/"
      - "/.github/actions/setup"
    schedule:
      interval: "weekly"
      day: "monday"
    # SPEC-014 I: se quitaron los `ignore` de actions/checkout, actions/setup-node y
    # softprops/action-gh-release. Sus comentarios ("v6 no existe", "latest es v4", "v3 no
    # existe") eran falsos: el 2026-10-07 las últimas versiones son checkout v7, setup-node
    # v7 y action-gh-release v3, y ci.yml usa v5. xlsx tampoco es ya una dependencia.
    # Los majors de actions llegan como PR y pasan por el job `build` y por ci-result.
