name: CI — ContaFlow (Extended)

# SPEC-014: solo `main` dispara `push` (las ramas de trabajo corren por su PR; antes `feat/**`
# duplicaba cada corrida) y los permisos por defecto son de solo lectura.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Un push nuevo a un PR cancela la corrida anterior de ese PR. NUNCA se cancela una corrida
# sobre `main`: SPEC-015 añade ahí un job que migra producción y no puede interrumpirse
# a media migración (SPEC-014 RN-5).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: 22

jobs:
  # ============================================================================
  # LINT + TYPE CHECK + TESTS
  # ============================================================================
  test:
    name: Lint + TypeScript + Tests + Coverage
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://mock:mock@localhost:5432/mock"
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup (pnpm + Node + dependencias)
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Generar cliente Prisma
        run: pnpm prisma generate

      # RN-4 (SPEC-014): el tope de warnings solo puede BAJAR. Medido el 2026-10-08 con
      # `eslint .`: 49 warnings, 0 errores. Ver el script `lint:ci` de package.json.
      - name: Lint (ESLint, sin warnings nuevos)
        run: pnpm lint:ci

      # Format check (Prettier). Activado el 2026-10-03 tras formatear src/ (SPEC-002 A).
      # Para corregir en local: pnpm format
      - name: Format check (Prettier)
        run: pnpm format:check

      - name: TypeScript type check
        run: pnpm tsc --noEmit

      # Los umbrales de cobertura viven SOLO en vitest.config.ts (`coverage.thresholds`) y
      # Vitest falla la corrida si no se cumplen. Antes había aquí un paso que repetía los
      # mismos números a mano (SPEC-014 H).
      # Los secretos de Clerk y Groq solo los recibe este paso (revisión de seguridad de
      # SPEC-014, L-6): antes iban en el env del job y los veían la instalación de
      # dependencias (con scripts), el lint y el type-check.
      - name: Tests + Coverage
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: pnpm vitest run --coverage

  # ============================================================================
  # ARCHITECTURE AUDIT (ADR-004, ADR-006 D-4, ADR-006 D-5, tipografía)
  #
  # ADR-001 (Serializable en correlativos) ya no se audita aquí con un `grep`: lo hace el
  # test de arquitectura `correlativo-serializable.test.ts`, que corre en el job `test`.
  # El chequeo "schema ↔ migraciones" lo hace `prisma migrate diff` en el job `integration`.
  # ============================================================================
  architecture:
    name: Architecture audit (ADRs + schema + append-only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup (pnpm + Node + dependencias)
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}

      # ========================================================================
      # GAP 2: ADR-004 — companyId en queries (context-aware, sin falsos positivos)
      # Busca 15 lineas ANTES y 10 lineas DESPUES — cubre el patron comun de
      # construir 'const where = { companyId, ... }' antes del findMany.
      # ========================================================================
      - name: "ADR-004: Auditar companyId en queries (findMany/findFirst)"
        run: |
          echo "Auditando que queries de dominio incluyen companyId..."

          # Para cada archivo .ts en src/modules (excl. tests)
          while IFS= read -r file; do
            grep -n "findMany\|findFirst" "$file" \
              | grep -Ev ":[[:space:]]*//" \
              | grep -v "companyId" \
              | grep -v "// ADR-004-EXCEPTION" \
              | while IFS=: read -r linenum rest; do
                # Verificar companyId en ventana [-15, +10] lineas alrededor del findMany
                startline=$((linenum - 15))
                endline=$((linenum + 10))
                if [ "$startline" -lt 1 ]; then startline=1; fi
                if ! sed -n "${startline},${endline}p" "$file" | grep -q "companyId\|// ADR-004-EXCEPTION"; then
                  echo "$file:$linenum: $rest"
                fi
              done
          done < <(find src/modules -name "*.ts" ! -name "*.test.ts" ! -path "*/__tests__/*") \
            > /tmp/adr004_violations.txt 2>/dev/null || true

          if [ -s /tmp/adr004_violations.txt ]; then
            echo "CRITICAL: Queries sin companyId encontradas:"
            cat /tmp/adr004_violations.txt
            echo ""
            echo "Solucion:"
            echo "  1. Agrega companyId al where clause"
            echo "  2. Si es excepcion documentada: // ADR-004-EXCEPTION: <razon>"
            exit 1
          fi

          echo "OK: ADR-004 — todas las queries tienen companyId"

      # ========================================================================
      # GAP 5: ADR-006 D-4 — AuditLog append-only
      # ========================================================================
      - name: "ADR-006 D-4: Validar que AuditLog es append-only"
        run: |
          echo "Validando que no hay auditLog.update o auditLog.delete en produccion..."

          VIOLATIONS=$(
            grep -rn "auditLog\.update\|auditLog\.delete\|auditLog\.deleteMany" \
              src/ --include="*.ts" \
              | grep -v "\.test\.ts" \
              | grep -v "__tests__" \
              | grep -v "// ADR-006-D4-EXCEPTION" \
              || true
          )

          if [ -n "$VIOLATIONS" ]; then
            echo "CRITICAL: AuditLog debe ser append-only (nunca update/delete):"
            echo "$VIOLATIONS"
            echo ""
            echo "Referencia: ADR-006 D-4 — AuditLog es inmutable"
            exit 1
          fi

          echo "OK: ADR-006 D-4 — AuditLog append-only garantizado"

      # ========================================================================
      # GAP 3: ADR-006 D-5 — Rate limiting en acciones financieras
      # ========================================================================
      - name: "ADR-006 D-5: Validar rate limiting en acciones financieras"
        run: |
          echo "Validando rate limiting en acciones financieras..."

          REQUIRED_ACTIONS=(
            "createInvoiceAction"
            "createRetentionAction"
            "createIGTFAction"
            "createAccountAction"
            "createTransactionAction"
            "extractInvoiceAction"
            "fetchBcvRateAction"
          )

          MISSING_LIMIT=()
          for action in "${REQUIRED_ACTIONS[@]}"; do
            FILES=$(grep -rl "export.*function $action\|export.*const $action.*=.*async\|export async function $action" \
              src/modules --include="*.actions.ts" 2>/dev/null || true)

            if [ -n "$FILES" ]; then
              for FILE in $FILES; do
                # Rate limit directo (checkRateLimit) o vía guard ADR-041
                # (requireCompanyAction con opcion `limiter:`, que llama
                # checkRateLimit internamente en src/lib/action-guard.ts)
                if ! grep -q "checkRateLimit" "$FILE" && ! { grep -q "requireCompanyAction" "$FILE" && grep -q "limiter:" "$FILE"; }; then
                  MISSING_LIMIT+=("$action (en $FILE)")
                fi
              done
            fi
          done

          if [ ${#MISSING_LIMIT[@]} -gt 0 ]; then
            echo "CRITICAL: Acciones sin rate limiting:"
            printf '%s\n' "${MISSING_LIMIT[@]}"
            echo ""
            echo "Solucion: agrega checkRateLimit(limiters.fiscal) despues de auth(),"
            echo "o migra a requireCompanyAction(companyId, { limiter: limiters.fiscal }) (ADR-041)"
            echo "Referencia: ADR-006 D-5"
            exit 1
          fi

          echo "OK: ADR-006 D-5 — acciones financieras tienen rate limiting"

      # ========================================================================
      # Prisma schema format
      # ========================================================================
      - name: "Prisma: Validar formato del schema"
        run: |
          # OJO: los `run` de Actions corren con `bash -e`, asi que comprobar $?
          # DESPUES del comando es codigo muerto — el step aborta antes de llegar
          # ahi y el annotation solo dice "exit code 1". El `if !` si captura el
          # fallo y deja el mensaje accionable en el log.
          if ! npx prisma format --check; then
            echo "::error::Schema Prisma no esta formateado. Ejecuta: npx prisma format y commitea el resultado."
            exit 1
          fi
          echo "OK: Prisma schema formateado correctamente"

      # ========================================================================
      # Tipografía: sin escalas de texto solapadas nuevas (SPEC-014 E). Estático: no usa BD.
      # ========================================================================
      - name: "Tipografía: verify:typography"
        run: pnpm verify:typography

  # ============================================================================
  # SECURITY AUDIT (npm audit)
  # ============================================================================
  security:
    name: Security audit (pnpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup (pnpm + Node + dependencias)
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}

      # xlsx migrado a exceljs — podemos subir el umbral a HIGH
      #
      # GHSA-qjx8-664m-686j (js-cookie <=3.0.5, HIGH):
      #   @clerk/shared pina js-cookie@3.0.5 como version EXACTA en todas sus versiones
      #   publicadas (incluyendo 4.13.0). pnpm no puede overridear versiones exactas de
      #   dependencias transitivas. El fix esta bloqueado en que Clerk bumpe su dep.
      #   Riesgo real bajo: la vulnerabilidad (prototype hijack en assign()) solo aplica
      #   si codigo externo puede pasar un objeto malicioso al constructor de js-cookie,
      #   lo cual Clerk controla internamente. Reabrir cuando @clerk/shared >= X use >=3.0.6.
      - name: pnpm audit (HIGH or above)
        run: pnpm audit --audit-level=high --ignore GHSA-qjx8-664m-686j

  # ============================================================================
  # BUILD (SPEC-014 F) — `next build` en cada PR
  #
  # Hasta ahora ningún job compilaba la app, y `vercel.json` ignora los builds de ramas
  # `dependabot/`: un PR de Dependabot podía mergearse sin haberse compilado nunca. Tampoco
  # lo veía el phase gate (tsc + vitest): errores como un export síncrono en un módulo
  # "use server" solo aparecen aquí.
  #
  # Sin SECRETOS a propósito: así corre igual en PRs de Dependabot y de forks (que no los
  # reciben), y una compilación no necesita credenciales reales. Los valores son ficticios;
  # la clave pública de Clerk tiene formato válido (pk_test_ + base64 de "clerk.example.com$").
  # Sin SENTRY_AUTH_TOKEN no se suben source maps.
  # ============================================================================
  build:
    name: Build (next build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: "postgresql://mock:mock@localhost:5432/mock"
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_Y2xlcmsuZXhhbXBsZS5jb20k"
      CLERK_SECRET_KEY: "sk_test_ci_build_dummy_not_a_real_key"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup (pnpm + Node + dependencias)
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build
        run: pnpm build

  # ============================================================================
  # INTEGRATION (SPEC-002) — tests contra Postgres real en un branch efímero de Neon
  #
  # Lo que los mocks no ven: constraints, triggers, RLS, Serializable, P2002 con el
  # adaptador real (LL-014). Corre en un proyecto de Neon DEDICADO (`contaflow-ci`, baseline
  # vacío): cada corrida clona un branch y aplica todas las migraciones desde cero, así que
  # ningún dato de clientes ni credencial de producción está al alcance del CI.
  # scripts/ci-neon-branch.mjs solo borra branches ci-<run>-<intento>
  # (ver scripts/lib/neon-ci-guards.mjs). Está en `needs` de ci-result (corrió en verde
  # el 2026-10-03); un resultado `skipped` se acepta, `failure`/`cancelled` no.
  #
  # SPEC-014 C y D: sobre ese mismo branch ya migrado corren además `prisma migrate diff`
  # (schema.prisma ↔ migraciones) y los verify:* que necesitan BD.
  # ============================================================================
  integration:
    name: Integration (Neon branch efímero)
    runs-on: ubuntu-latest
    # RN-5: los PRs de forks no reciben secretos; se omite sin fallar.
    # Dependabot se excluye: sus PRs no reciben los secretos del environment y quedarían
    # esperando una aprobación que no aporta nada.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    timeout-minutes: 20
    # Environment con revisores requeridos: ningún PR ejecuta código con la key de Neon
    # sin aprobación humana. Los secretos NEON_* viven SOLO aquí, no a nivel de repositorio.
    environment: neon-ci
    permissions:
      contents: read
    # La key NO va en el env del job: solo la reciben los pasos que la usan (gate, create,
    # delete). Así `pnpm install`, `prisma generate` y los tests no la ven.
    steps:
      - name: Verificar secretos
        id: gate
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        run: |
          if [ -z "$NEON_API_KEY" ] || [ -z "$NEON_PROJECT_ID" ]; then
            # Este job solo corre en PRs del mismo repo (sin forks ni Dependabot), donde los
            # secretos del environment SIEMPRE existen: que falten es una mala configuración.
            # Fallar en voz alta; omitir en silencio daría un "verde" sin haber probado nada.
            echo "::error::Faltan NEON_API_KEY / NEON_PROJECT_ID en el environment neon-ci"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 1
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v5

      # RN-6 (SPEC-014): --ignore-scripts. El código de instalación de las dependencias no
      # corre en un job con acceso a Neon. El único postinstall del repo es `prisma generate`,
      # que va aparte.
      - name: Setup (pnpm + Node + dependencias, sin scripts)
        if: steps.gate.outputs.enabled == 'true'
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          ignore-scripts: "true"

      - name: Generar cliente Prisma
        if: steps.gate.outputs.enabled == 'true'
        run: pnpm prisma generate

      - name: Crear branch efímero
        if: steps.gate.outputs.enabled == 'true'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        run: node scripts/ci-neon-branch.mjs create

      - name: Aplicar migraciones al branch efímero
        if: steps.gate.outputs.enabled == 'true'
        run: pnpm prisma migrate deploy

      # SPEC-014 C + SPEC-022: la BD que resulta de aplicar TODAS las migraciones debe coincidir con
      # schema.prisma. Reemplaza al antiguo chequeo "schema ↔ migraciones", que daba verde si
      # cambiaba cualquier línea de cualquier migración. El datasource sale de prisma.config.ts
      # (DATABASE_URL_DIRECT, exportado por ci-neon-branch.mjs). Código de salida del diff:
      # 0 = igual, 1 = error, 2 = hay diferencias.
      #
      # SIN línea base: la deriva que la primera corrida real destapó (27 sentencias) se resolvió
      # en SPEC-022 y scripts/ci/migrate-diff-baseline.sql se borró. Cualquier diferencia nueva
      # (schema.prisma sin migración, o una migración que deja la BD distinta del schema) rompe el job:
      # se arregla con una migración o corrigiendo el schema, no tolerándola.
      - name: "Schema ↔ migraciones (prisma migrate diff)"
        if: steps.gate.outputs.enabled == 'true'
        run: |
          set +e
          pnpm prisma migrate diff \
            --from-config-datasource \
            --to-schema prisma/schema.prisma \
            --exit-code \
            --script > "$RUNNER_TEMP/migrate-diff.sql"
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "OK: la BD migrada coincide con schema.prisma"
            exit 0
          fi
          echo "::group::SQL que llevaría la BD migrada a schema.prisma (exit $code)"
          cat "$RUNNER_TEMP/migrate-diff.sql"
          echo "::endgroup::"
          echo "::error::migrate diff devolvió $code (2 = hay diferencias entre las migraciones y schema.prisma)"
          exit "$code"

      # SPEC-014 D: siembra mínima SOLO en este branch efímero. verify:rls:runtime necesita
      # filas de 2+ empresas y sale con 1 si no puede verificar nada (ADR-044 D-8.3).
      - name: Sembrar sonda de RLS (branch efímero)
        if: steps.gate.outputs.enabled == 'true'
        run: pnpm prisma db execute --file scripts/ci/seed-rls-probe.sql

      # SPEC-014 D: los 4 verify:* con BD contra el branch efímero. scripts/lib/db-url.mjs
      # exige DATABASE_URL_TEST en CI y nunca cae a DATABASE_URL ni a .env.local (RN-2).
      - name: "verify:rls (estructural)"
        if: steps.gate.outputs.enabled == 'true'
        run: pnpm verify:rls

      - name: "verify:rls:runtime (conductual)"
        if: steps.gate.outputs.enabled == 'true'
        run: pnpm verify:rls:runtime

      - name: "verify:drift (índices y constraints)"
        if: steps.gate.outputs.enabled == 'true'
        run: pnpm verify:drift

      - name: "verify:enum-drift"
        if: steps.gate.outputs.enabled == 'true'
        run: pnpm verify:enum-drift

      - name: Tests de integración
        if: steps.gate.outputs.enabled == 'true'
        run: pnpm test:integration

      # RN-4: siempre, también si fallan los pasos anteriores o se cancela el job.
      # Es idempotente: si el branch no llegó a crearse, no hay nada que borrar.
      - name: Borrar branch efímero
        if: always() && steps.gate.outputs.enabled == 'true'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        run: node scripts/ci-neon-branch.mjs delete

  # ============================================================================
  # RESULT CHECK
  # ============================================================================
  ci-result:
    name: CI Result (all checks passed)
    runs-on: ubuntu-latest
    needs: [test, architecture, security, build, integration]
    if: always()
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "FAIL: test job failed"
            exit 1
          fi
          if [ "${{ needs.architecture.result }}" != "success" ]; then
            echo "FAIL: architecture audit job failed"
            exit 1
          fi
          if [ "${{ needs.security.result }}" != "success" ]; then
            echo "FAIL: security audit job failed"
            exit 1
          fi
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "FAIL: build job failed"
            exit 1
          fi
          # integration se OMITE (skipped) en push, forks, Dependabot o sin secretos: eso no es
          # un fallo. Solo cuenta como fallo si corrió y no terminó en success.
          if [ "${{ needs.integration.result }}" != "success" ] && [ "${{ needs.integration.result }}" != "skipped" ]; then
            echo "FAIL: integration job failed"
            exit 1
          fi
          echo "OK: All CI checks PASSED"

  # ============================================================================
  # OPTIONAL: Deploy migraciones a Neon (solo en main, descomentar en produccion)
  # ============================================================================
  # deploy-migrations:
  #   name: Deploy migrations to Neon
  #   runs-on: ubuntu-latest
  #   if: github.ref == 'refs/heads/main' && github.event_name == 'push'
  #   needs: [test, architecture, security]
  #   env:
  #     DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
  #   steps:
  #     - uses: actions/checkout@v5
  #     - uses: actions/setup-node@v5
  #       with:
  #         node-version: ${{ env.NODE_VERSION }}
  #         cache: npm
  #     - run: npm ci
  #     - name: Aplicar migraciones en Neon
  #       run: npx prisma migrate deploy
  #       timeout-minutes: 10
